<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b2545">
<title>わからない — Tsutawari</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f8;
    --fg: #14141a;
    --muted: #6a6a76;
    --button: #2f6df6;
    --button-pressed: #1f4fc0;
    --disabled: #b6b8c2;
    --ok: #1f8a4c;
    --ng: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101014;
      --fg: #f2f2f5;
      --muted: #9a9aa6;
      --disabled: #4a4a55;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow-x: hidden;
    overflow-y: hidden;             /* 押す画面は縦に短く。スクロールさせない */
  }

  /* CSS の display は UA の [hidden]{display:none} に勝つので、明示的に打ち消す */
  [hidden] { display: none !important; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  header { text-align: center; padding-top: 8px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .lead { font-size: 14px; color: var(--muted); margin: 0; }

  /* ボタンは親指の届く下寄りに、大きく置く */
  main {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
  }

  /* 1個なら大きな丸、2〜4個なら縦に積む。どの数でもスクロールさせない */
  #buttons {
    width: 100%;
    display: grid;
    gap: 12px;
    justify-items: center;
  }
  #buttons.count-1 { grid-template-columns: 1fr; }
  #buttons.count-2, #buttons.count-3, #buttons.count-4 { grid-template-columns: 1fr; }

  .press {
    touch-action: manipulation;
    appearance: none;
    border: none;
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.03em;
    width: 100%;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  .press:active:not(:disabled) { transform: scale(0.96); filter: brightness(0.88); }
  .press:disabled { background: var(--disabled) !important; box-shadow: none; cursor: default; }

  /* 伝わっていない=暖色 / 伝わっている=寒色。赤緑は使わない */
  .press.negative { background: #d97522; box-shadow: 0 8px 24px rgba(217, 117, 34, 0.32); }
  .press.positive { background: #2678c7; box-shadow: 0 8px 24px rgba(38, 120, 199, 0.32); }

  /* 1個のときだけ丸く大きく */
  #buttons.count-1 .press {
    border-radius: 999px;
    width: min(78vw, 300px);
    aspect-ratio: 1;
    font-size: 30px;
  }
  #buttons.count-2 .press { border-radius: 24px; height: 21vh; min-height: 110px; font-size: 26px; }
  #buttons.count-3 .press { border-radius: 20px; height: 15vh; min-height: 84px; font-size: 23px; }
  #buttons.count-4 .press { border-radius: 18px; height: 12vh; min-height: 68px; font-size: 21px; }

  /* スタンプ。押した実感はその場のアニメーションで返す（送信結果は待たせない） */
  #stamps {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .stamp {
    touch-action: manipulation;
    appearance: none;
    border: 1px solid var(--disabled);
    background: transparent;
    border-radius: 999px;
    width: 52px;
    height: 52px;
    font-size: 24px;
    line-height: 1;
    padding: 0;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .stamp:active { transform: scale(1.25); background: rgba(127, 127, 127, 0.18); }
  .stamp:disabled { opacity: 0.4; }
  .stamp.sent { animation: pop 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp.sent { animation: none; }
  }

  /* ---- 感想モード ----
     発表が終わったら、押す画面ではなく「感想を書くページ」に切り替える。
     ボタンの下に足すのではなく、main ごと畳んで場所を明け渡す。 */
  body.writing main,
  body.writing #stamps { display: none !important; }

  body.writing {
    justify-content: flex-start;
    overflow-y: auto;               /* フォームは入りきらないのでスクロールさせる */
    height: auto;
    min-height: 100%;
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }

  body.writing header { padding-top: 4px; }

  /* 発表後の感想フォーム。終了してから出る */
  #feedback {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    text-align: left;
    margin-top: 22px;
  }
  #feedback h2 { font-size: 15px; font-weight: 600; margin: 0; }
  #feedback .q { font-size: 13px; color: var(--muted); margin: 0 0 7px; }

  #body {
    width: 100%;
    min-height: 96px;
    padding: 12px;
    border: 1px solid var(--disabled);
    border-radius: 12px;
    background: var(--bg);
    color: var(--fg);
    font-family: inherit;
    font-size: 16px;   /* iOS で拡大されないように16px以上 */
    line-height: 1.6;
    resize: none;
  }
  #body:focus { outline: 2px solid var(--button); outline-offset: -1px; }

  .delays { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .delay {
    touch-action: manipulation;
    appearance: none;
    border: 1px solid var(--disabled);
    background: transparent;
    color: var(--fg);
    border-radius: 10px;
    min-height: 46px;
    font-family: inherit;
    font-size: 14px;
  }
  .delay.on { background: var(--button); border-color: var(--button); color: #fff; font-weight: 700; }
  .delay.wide { grid-column: span 2; }

  #send {
    touch-action: manipulation;
    appearance: none;
    border: none;
    border-radius: 12px;
    min-height: 52px;
    background: var(--button);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
  }
  #send:disabled { background: var(--disabled); }

  footer { min-height: 48px; text-align: center; }
  #status { font-size: 15px; margin: 0; min-height: 22px; }
  #status.ok { color: var(--ok); }
  #status.ng { color: var(--ng); }
  #code { font-size: 12px; color: var(--muted); margin: 6px 0 0; letter-spacing: 0.12em; }
</style>
</head>
<body>

<header>
  <h1 id="heading">読み込んでいます…</h1>
  <p class="lead">発表者には、終わってからまとめて届きます</p>
</header>

<main>
  <div id="buttons"></div>
</main>

<div id="stamps" hidden></div>

<div id="feedback" hidden>
  <h2>発表はどうでしたか</h2>
  <div>
    <p class="q">感想（任意）</p>
    <textarea id="body" maxlength="500" placeholder="書きたいことがあれば"></textarea>
  </div>
  <div>
    <p class="q">ボタンを押したとき、気づいてからどれくらい経っていましたか</p>
    <div class="delays" id="delays"></div>
  </div>
  <button id="send" type="button">送る</button>
</div>

<footer>
  <p id="status"></p>
  <p id="code"></p>
</footer>

<script>
(() => {
  "use strict";

  // ---- 設定（発表者アプリの SupabaseConfiguration と同じ値にする） ----
  // publishable key はここに書いてよい。守っているのは鍵ではなく RLS。
  // sb_secret_... と service_role は絶対に置かない。
  const SUPABASE_URL = "https://fzkfezltxcabwzqrjwhe.supabase.co";
  const PUBLISHABLE_KEY = "sb_publishable_HoE0LuoeHV8lLyM_6ZqejA_XwUM-Fjq";

  const COOLDOWN_MS = 3000;    // 1人の連打が「多数がつまずいた」に化けるのを防ぐ

  const container = document.getElementById("buttons");
  const stampRow = document.getElementById("stamps");
  const feedbackBox = document.getElementById("feedback");
  const bodyField = document.getElementById("body");
  const delayRow = document.getElementById("delays");
  const sendButton = document.getElementById("send");
  const heading = document.getElementById("heading");
  const lead = document.querySelector(".lead");
  const status = document.getElementById("status");
  const codeLabel = document.getElementById("code");

  const setStatus = (text, kind) => {
    status.textContent = text;
    status.className = kind || "";
  };

  // publishable key は JWT ではないので apikey ヘッダーにだけ載せる。
  // Authorization: Bearer に入れると JWT として検証されて失敗する。
  const headers = {
    "apikey": PUBLISHABLE_KEY,
    "Content-Type": "application/json"
  };

  const rawCode = new URLSearchParams(location.search).get("s") || "";
  const code = rawCode.trim().toUpperCase();

  let sessionId = null;      // 開始前は null
  let buttons = [];          // 発表者が決めたボタン
  let cooling = false;       // クールダウン中は全ボタンを止める

  if (!code) {
    heading.textContent = "参加コードがありません";
    setStatus("QRから開き直してください", "ng");
    return;
  }
  codeLabel.textContent = code;

  // コードから部屋を引く。終了済みなら何も返らない。
  // 開始前でも部屋は見つかる（has_started が false で返る）。
  const lookup = async () => {
    const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/lookup_session", {
      method: "POST",
      headers,
      body: JSON.stringify({ p_code: code })
    });
    if (!response.ok) throw new Error("lookup failed: " + response.status);

    const rows = await response.json();
    return rows.length ? rows[0] : null;
  };

  const send = async (kind) => {
    const response = await fetch(SUPABASE_URL + "/rest/v1/reactions", {
      method: "POST",
      headers: Object.assign({ "Prefer": "return=minimal" }, headers),
      body: JSON.stringify({ session_id: sessionId, kind })
    });
    // RLS で弾かれた = まだ始まっていない、または終わっている。
    // どちらかは lookup し直さないと分からない。
    if (response.status === 401 || response.status === 403) {
      throw Object.assign(new Error("rejected"), { rejected: true });
    }
    if (!response.ok) throw new Error("insert failed: " + response.status);
  };

  // ---- スタンプ ----
  // 反応（わからない等）とは別物。分析には使わず、その場で流れて消えるだけ。
  // だから結果を待たせず、押した瞬間にアニメーションで返す。

  const STAMPS = ["\u{1F44F}", "\u{2764}\u{FE0F}", "\u{1F525}", "\u{1F602}", "\u{1F389}", "\u{1F44D}"];
  const STAMP_GAP_MS = 400;   // 連打は歓迎だが、送りすぎは抑える
  let lastStampAt = 0;

  const sendStamp = async (symbol) => {
    const response = await fetch(SUPABASE_URL + "/rest/v1/stamps", {
      method: "POST",
      headers: Object.assign({ "Prefer": "return=minimal" }, headers),
      body: JSON.stringify({ session_id: sessionId, symbol })
    });
    if (!response.ok) throw new Error("stamp failed: " + response.status);
  };

  const buildStamps = () => {
    stampRow.replaceChildren(...STAMPS.map((symbol) => {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "stamp";
      el.textContent = symbol;
      el.setAttribute("aria-label", "スタンプを送る " + symbol);
      el.addEventListener("click", () => {
        if (!sessionId) return;
        const now = Date.now();
        if (now - lastStampAt < STAMP_GAP_MS) return;
        lastStampAt = now;

        el.classList.remove("sent");
        void el.offsetWidth;          // アニメーションを撒き直す
        el.classList.add("sent");
        if (navigator.vibrate) navigator.vibrate(8);

        // 失敗しても黙って捨てる。スタンプは届かなくても発表は成立する
        sendStamp(symbol).catch(() => {});
      });
      return el;
    }));
  };

  // ---- 発表後の感想 ----
  // 押下とは条件が逆。**終了していないと書けない。**
  // 遅れの設問は、45秒という窓が妥当かを測るためにある（spec.md 9章）。

  const DELAYS = [
    { value: 0,  label: "すぐ押した" },
    { value: 10, label: "10秒くらい" },
    { value: 30, label: "30秒くらい" },
    { value: 60, label: "1分以上" },
    { value: -1, label: "覚えていない", wide: true }
  ];
  let chosenDelay = null;
  let finishedSessionId = null;

  const buildDelays = () => {
    delayRow.replaceChildren(...DELAYS.map((option) => {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "delay" + (option.wide ? " wide" : "");
      el.textContent = option.label;
      el.addEventListener("click", () => {
        // もう一度押せば取り消せる。答えたくない人を縛らない
        chosenDelay = chosenDelay === option.value ? null : option.value;
        for (const other of delayRow.children) other.classList.remove("on");
        if (chosenDelay !== null) el.classList.add("on");
        refreshSend();
      });
      return el;
    }));
  };

  const refreshSend = () => {
    const written = bodyField.value.trim().length > 0;
    sendButton.disabled = !written && chosenDelay === null;
  };

  // lookup_session は終了済みを返さないので、終了後の窓口が別に要る
  const lookupFinished = async () => {
    const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/lookup_finished_session", {
      method: "POST",
      headers,
      body: JSON.stringify({ p_code: code })
    });
    if (!response.ok) return null;
    const rows = await response.json();
    return rows.length ? rows[0] : null;
  };

  const sendFeedback = async () => {
    const payload = { session_id: finishedSessionId, body: bodyField.value.trim() };
    if (chosenDelay !== null) payload.press_delay = chosenDelay;

    const response = await fetch(SUPABASE_URL + "/rest/v1/feedback", {
      method: "POST",
      headers: Object.assign({ "Prefer": "return=minimal" }, headers),
      body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error("feedback failed: " + response.status);
  };

  sendButton.addEventListener("click", async () => {
    if (sendButton.disabled) return;
    sendButton.disabled = true;
    setStatus("送っています…");
    try {
      await sendFeedback();
      feedbackBox.hidden = true;
      document.body.classList.remove("writing");
      heading.textContent = "ありがとうございました";
      lead.textContent = "発表者に届きました";
      setStatus("");
    } catch (error) {
      setStatus("送れませんでした", "ng");
      refreshSend();
    }
  });

  bodyField.addEventListener("input", refreshSend);

  // 終了後の画面。書ける窓が開いていればフォームを出す
  const showFinished = async () => {
    sessionId = null;
    stampRow.hidden = true;
    container.replaceChildren();
    setStatus("");

    const room = await lookupFinished().catch(() => null);
    if (room && room.accepts_feedback) {
      finishedSessionId = room.session_id;
      buildDelays();
      refreshSend();
      // ボタンの画面ごと畳んで、感想を書くページにする
      document.body.classList.add("writing");
      heading.textContent = "おつかれさまでした";
      lead.textContent = "書いたものは発表者にだけ届きます";
      feedbackBox.hidden = false;
    } else {
      heading.textContent = "この発表は終了しました";
      lead.textContent = "感想の受付も終わっています";
    }
  };

  // ---- 描画 ----

  const render = () => {
    container.className = "count-" + Math.min(4, Math.max(1, buttons.length));
    container.replaceChildren(...buttons.map((button) => {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "press " + (button.weight > 0 ? "positive" : "negative");
      el.textContent = button.label;
      el.dataset.key = button.key;
      el.addEventListener("click", () => onPress(button, el));
      return el;
    }));
  };

  const setAllDisabled = (disabled) => {
    for (const el of container.children) el.disabled = disabled;
  };

  const restoreLabels = () => {
    for (const el of container.children) {
      const button = buttons.find((b) => b.key === el.dataset.key);
      if (button) el.textContent = button.label;
    }
  };

  // 押した本人にだけ効くクールダウン。どのボタンを押しても全部止める
  // （「わからない」の直後に「わかりやすい」を押せても意味がない）
  const cooldown = (pressed) => {
    cooling = true;
    setAllDisabled(true);
    let remaining = Math.round(COOLDOWN_MS / 1000);
    pressed.textContent = remaining;

    const tick = setInterval(() => {
      remaining -= 1;
      if (remaining > 0) {
        pressed.textContent = remaining;
        return;
      }
      clearInterval(tick);
      cooling = false;
      restoreLabels();
      setAllDisabled(false);
      setStatus("");
    }, 1000);
  };

  // ---- 待機中だけ、開始したかを見にいく ----
  //
  // 設計判断2（リアルタイム同期インフラを持たない）の狙いは
  // 「**反応の表示**にリアルタイム性は要らない」ことで、
  // 「開始したかどうか」の状態変化はその話とは別。
  // 待っている人に「まもなく始まります」を押させて確かめさせるのは単に不親切だった。
  //
  // ただし **待機中だけ**。始まったら止める。
  // 発表中は聴衆が聞くべき時間なので、端末に何もさせない。

  const WAIT_POLL_MS = 3000;
  // 発表が終わってから感想のページに切り替わるまでの待ち。
  // ここが長いと、終わったのにボタンの画面に取り残される時間が伸びる
  const LIVE_POLL_MS = 3000;
  const WAIT_GIVE_UP_MS = 20 * 60 * 1000;   // 20分待っても始まらなければ諦める
  let waitTimer = null;
  let liveTimer = null;
  let waitStartedAt = 0;
  let waitInterval = WAIT_POLL_MS;

  const stopWaitPolling = () => {
    if (waitTimer) clearTimeout(waitTimer);
    waitTimer = null;
  };

  const stopLivePolling = () => {
    if (liveTimer) clearTimeout(liveTimer);
    liveTimer = null;
  };

  const scheduleWaitPoll = () => {
    stopWaitPolling();
    if (document.hidden) return;              // 画面を見ていない間は止める
    waitTimer = setTimeout(pollWaiting, waitInterval);
  };

  const scheduleLivePoll = () => {
    stopLivePolling();
    if (document.hidden) return;
    liveTimer = setTimeout(pollLive, LIVE_POLL_MS);
  };

  // 発表中。終了を拾って感想のページへ送り出すためだけに見にいく。
  // 押されるのを待つと、押さずに聞いていた人がボタンの画面に取り残される。
  const pollLive = async () => {
    liveTimer = null;
    if (!sessionId) return;
    try {
      const room = await lookup();
      if (!room) { showClosed(); return; }    // 終了した
    } catch (error) {
      // 通信が切れただけかもしれない。押下は別経路で弾かれるので、黙って続ける
    }
    scheduleLivePoll();
  };

  const pollWaiting = async () => {
    waitTimer = null;
    if (sessionId) return;                    // もう始まっている

    if (Date.now() - waitStartedAt > WAIT_GIVE_UP_MS) {
      setStatus("まだ始まっていません。画面を開き直してください");
      return;
    }

    try {
      const room = await lookup();
      waitInterval = WAIT_POLL_MS;            // 成功したら間隔を戻す
      if (!room) { showClosed(); return; }
      if (room.has_started) {
        adopt(room);
        showReady();
        setStatus("始まりました", "ok");
        if (navigator.vibrate) navigator.vibrate(30);
        return;
      }
    } catch (error) {
      waitInterval = Math.min(waitInterval * 2, 30000);   // 失敗したら間隔を広げる
    }
    scheduleWaitPoll();
  };

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { stopWaitPolling(); stopLivePolling(); return; }
    if (!feedbackBox.hidden) return;          // 感想を書いている間は何もしない
    // **戻ってきたら待たずに見る。**裏にいる間に終わっているかもしれない。
    if (sessionId) { stopLivePolling(); pollLive(); } else { stopWaitPolling(); pollWaiting(); }
  });

  const showWaiting = () => {
    sessionId = null;
    stampRow.hidden = true;
    heading.textContent = "まもなく始まります";
    setAllDisabled(true);       // 自動で切り替わるので、押させる必要がない
    setStatus("発表が始まるのを待っています");

    if (!waitStartedAt) waitStartedAt = Date.now();
    scheduleWaitPoll();
  };

  const showReady = () => {
    stopWaitPolling();
    scheduleLivePoll();
    heading.textContent = buttons.length > 1
      ? "感じたものを押してください"
      : "わからなかったら押してください";
    setAllDisabled(false);
    setStatus("");
    stampRow.hidden = false;
  };

  // 終了を検出したら、感想の画面へ切り替える
  const showClosed = () => { stopWaitPolling(); stopLivePolling(); showFinished(); };

  // ---- 押されたとき ----

  const onPress = async (button, el) => {
    if (cooling || el.disabled) return;

    // まだ始まっていないなら、押すたびに状態を見に行く（ポーリングはしない）。
    if (!sessionId) {
      setAllDisabled(true);
      setStatus("確認しています…");
      try {
        const room = await lookup();
        if (!room) { showClosed(); return; }
        if (!room.has_started) { showWaiting(); return; }
        adopt(room);
        showReady();
        setStatus("始まりました。押せます", "ok");
      } catch (error) {
        setAllDisabled(false);
        setStatus("つながりませんでした", "ng");
      }
      return;
    }

    setAllDisabled(true);
    setStatus("送っています…");

    try {
      await send(button.key);
      setStatus("届きました", "ok");
      if (navigator.vibrate) navigator.vibrate(20);
      cooldown(el);
    } catch (error) {
      if (error.rejected) {
        const room = await lookup().catch(() => null);
        if (room && !room.has_started) { showWaiting(); }
        else { showClosed(); }
        return;
      }
      setStatus("送れませんでした", "ng");
      setAllDisabled(false);
    }
  };

  /// サーバーから来たボタン定義を採用する。壊れていたら既定に落とす。
  const adopt = (room) => {
    sessionId = room.session_id;
    const incoming = Array.isArray(room.reaction_buttons) ? room.reaction_buttons : [];
    const valid = incoming
      .filter((b) => b && typeof b.key === "string" && typeof b.label === "string" && b.label.length)
      .slice(0, 4);
    buttons = valid.length ? valid : [{ key: "unclear", label: "わからない", weight: -1 }];
    render();
  };

  buildStamps();

  (async () => {
    setStatus("準備しています…");
    try {
      const room = await lookup();
      if (!room) {
        // 終了済みかもしれない。感想の窓が開いていればそちらを出す
        await showFinished();
        if (feedbackBox.hidden) {
          heading.textContent = "見つかりませんでした";
          setStatus("この発表は終了しているか、コードが違います", "ng");
        }
        return;
      }
      adopt(room);
      if (!room.has_started) { showWaiting(); return; }
      showReady();
    } catch (error) {
      heading.textContent = "つながりませんでした";
      setStatus("通信を確認してください", "ng");
    }
  })();
})();
</script>

</body>
